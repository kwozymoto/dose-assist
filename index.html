<!doctype html>
<html lang="en-NZ" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WhenDose</title>
  <meta name="description" content="Keep a record of your children's medicine doses and get a reminder when the next dose is allowed.">
  <meta name="theme-color" content="#edf1ff">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="WhenDose">
  <link rel="stylesheet" href="css/app.css">
  <script>
    /* Paint dark before first render at night, so a 3am open does not flash white. */
    (function () { var h = new Date().getHours(); if (h >= 19 || h < 7 || matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark'; })();
  </script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <div id="clockBanner" class="clock-banner" hidden></div>
  <header id="topbar" class="topbar"></header>
  <div id="alerts" class="alerts" aria-live="assertive"></div>
  <main id="view" class="view" tabindex="-1">
    <p class="loading">Loading…</p>
  </main>
  <p id="lifeline" class="lifeline"></p>
  <nav id="tabs" class="tabs" aria-label="Main">
    <a href="#/" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v8.5a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>Home</span></a>
    <a href="#/bottles" data-tab="bottles"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 3h5v3l2 2.5V20a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1V8.5l2-2.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M7.5 12.5h9" stroke="currentColor" stroke-width="2"/></svg><span>Medicines</span></a>
    <a href="#/help" data-tab="help"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .8-1 1.5v.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="1.2" fill="currentColor"/></svg><span>Help</span></a>
    <a href="#/settings" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Settings</span></a>
  </nav>
  <div id="updateBar" class="update-bar" role="status">
    <span>New version ready</span>
    <button id="btnReload" class="btn btn-primary">Reload</button>
    <button id="btnUpdateNo" class="btn btn-quiet">Later</button>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <noscript><p class="stack">WhenDose needs JavaScript turned on.</p></noscript>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/pwa.js"></script>
</body>
</html>
