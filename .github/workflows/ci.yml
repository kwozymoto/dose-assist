name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Every checker, the tests (engine, storage, reminders, push
      # encryption, worker), engine coverage and the type check.
      - run: node tools/check_all.mjs
        env:
          TZ: Pacific/Auckland
